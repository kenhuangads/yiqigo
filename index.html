<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一起GO 翻譯神器｜台灣人的出國翻譯利器</title>
<meta name="description" content="為台灣人量身打造的免費翻譯神器：即時雙向語音對話、相機菜單翻譯、照片翻譯、旅遊常用句庫。繁體中文、英文、日文、韓文，內建台灣用語守護。">
<meta property="og:title" content="一起GO 翻譯神器">
<meta property="og:description" content="真正懂台灣人的出國翻譯神器：對話・相機・輸入・照片・句庫">
<meta name="theme-color" content="#0E9F8A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一起GO">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7.5h3.2l1.6-2h6.4l1.6 2H20a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 13h.01M17 13h.01M8.5 14.5h7"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m6.5 15.5 3.8-4 3 3.2 1.8-1.8 2.4 2.6"/><circle cx="9.2" cy="9.4" r="1.3"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 1 6.5 18H19v3H6.5A1.5 1.5 0 0 1 5 19.5zM9 7h6M9 10.5h4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14m0 0-3.2-3.2M18 8l-3.2 3.2M20 16H6m0 0 3.2-3.2M6 16l3.2 3.2"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v11M12 3 8.5 6.5M12 3l3.5 3.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.7M6.5 6.5 7.4 19a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-12.5M10 10.5v6M14 10.5v6"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M8 5a7.5 7.5 0 0 0 0 14M8 19l-2.5-2.5M8 19l2.5 2.5M16 19a7.5 7.5 0 0 0 0-14M16 5l-2.5 2.5M16 5l2.5-2.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 5 13.5h5.5L11 22l8-11.5h-5.5z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-retake" viewBox="0 0 24 24"><path d="M4.5 10a8 8 0 0 1 13.8-3.6L20 8.5M20 4v4.5h-4.5M19.5 14a8 8 0 0 1-13.8 3.6L4 15.5M4 20v-4.5h4.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6.5H20M8.5 12H20M8.5 17.5H20M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0 3.5-3.5M12 14 8.5 10.5"/><path d="M5 16v3a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
</svg>

<div id="app">
  <header class="topbar">
    <div class="brand" title="一起GO 翻譯神器">
      <span class="logo">譯</span>
      <span class="brand-txt"><strong>一起GO</strong><small>台灣人的翻譯神器</small></span>
    </div>
    <div class="pairbar" title="語言配對">
      <span class="pair-fixed">🇹🇼 中文</span>
      <svg class="i pair-swap"><use href="#i-swap"/></svg>
      <select id="pairForeign" aria-label="選擇對方語言"></select>
    </div>
    <button class="iconbtn" id="btnSettings" title="設定" aria-label="設定"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <div id="netBanner" class="banner warn" hidden>📡 目前離線：語音與雲端翻譯暫停，「句庫」與已快取的翻譯仍可使用</div>
  <div id="supportBanner" class="banner warn" hidden></div>

  <main id="main">

    <!-- 即時對話 -->
    <section id="tab-talk" class="tab active" aria-label="即時對話">
      <div class="talk-wrap" id="talkWrap">
        <div class="talk-panel them" id="panelThem">
          <div class="talk-log" id="logThem"></div>
          <div class="talk-foot">
            <div class="interim" id="interimThem" hidden></div>
            <button class="micbtn them" id="micThem">
              <span class="micbtn-ring"></span>
              <svg class="i"><use href="#i-mic"/></svg>
              <span class="micbtn-label" id="micThemLabel">タップして日本語で話す</span>
            </button>
          </div>
        </div>

        <div class="talk-tools">
          <button id="btnFlip" class="tool" title="上半部旋轉 180°，面對面各看各的語言">
            <svg class="i"><use href="#i-flip"/></svg><span>面對面</span>
          </button>
          <button id="btnAutoSpeak" class="tool on" title="翻譯完成自動朗讀給對方聽">
            <svg class="i"><use href="#i-speaker"/></svg><span>自動朗讀</span>
          </button>
          <button id="btnClearTalk" class="tool" title="清除對話">
            <svg class="i"><use href="#i-trash"/></svg><span>清除</span>
          </button>
        </div>

        <div class="talk-panel me" id="panelMe">
          <div class="talk-log" id="logMe">
            <div class="talk-hint" id="talkHint">
              <strong>👋 開始跨語言對話</strong>
              <p>點下方麥克風說中文，系統即時翻譯並唸給對方聽；<br>對方點上方按鈕回話，你會看到中文並聽到語音。</p>
              <p class="muted">面對面時開啟「面對面」，上半部會轉向給對方看。</p>
            </div>
          </div>
          <div class="talk-foot">
            <div class="interim" id="interimMe" hidden></div>
            <button class="micbtn me" id="micMe">
              <span class="micbtn-ring"></span>
              <svg class="i"><use href="#i-mic"/></svg>
              <span class="micbtn-label">點一下・說中文</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 相機翻譯 -->
    <section id="tab-camera" class="tab" aria-label="相機翻譯">
      <div class="cam-stage" id="camStage">
        <video id="camVideo" playsinline autoplay muted></video>
        <canvas id="camOverlay" class="cam-overlay" aria-hidden="true"></canvas>
        <div class="cam-top">
          <label class="cam-srcwrap">原文
            <select id="camSource" aria-label="原文語言"></select>
          </label>
          <button id="btnLiveMode" class="cam-live" title="即時翻譯：免按快門自動翻譯"><span>即時：開</span></button>
          <button id="btnTorch" class="cam-tool" hidden title="手電筒"><svg class="i"><use href="#i-bolt"/></svg></button>
        </div>
        <div class="cam-status" id="camLiveStatus" hidden></div>
        <div class="cam-bottom">
          <div class="cam-tip" id="camTip">對準文字保持穩定，自動翻成繁體中文；按快門可拍照細看</div>
          <button id="btnShutter" aria-label="拍照翻譯"><span></span></button>
        </div>
        <button class="cam-playhint" id="camPlayHint" hidden>
          <svg class="i"><use href="#i-camera"/></svg>
          <span>點一下啟動相機預覽</span>
        </button>
        <div class="cam-msg" id="camMsg" hidden>
          <p id="camMsgText"></p>
          <button class="btn primary" id="btnCamToPhoto">改用「照片」上傳翻譯</button>
        </div>
      </div>
      <div class="vision-result" id="camResult" hidden></div>
    </section>

    <!-- 輸入翻譯 -->
    <section id="tab-text" class="tab" aria-label="輸入翻譯">
      <div class="pad">
        <div class="txt-langrow">
          <select id="txtFrom" aria-label="原文語言"></select>
          <button id="txtSwap" class="iconbtn" title="交換語言"><svg class="i"><use href="#i-swap"/></svg></button>
          <select id="txtTo" aria-label="譯文語言"></select>
        </div>
        <div class="txt-inputwrap">
          <textarea id="txtInput" rows="4" placeholder="輸入文字，停頓即自動翻譯…" maxlength="3000"></textarea>
          <div class="txt-inputbar">
            <span id="txtCount" class="muted small">0/3000</span>
            <span class="grow"></span>
            <button id="btnTxtClear" class="btn ghost">清除</button>
            <button id="btnTxtGo" class="btn primary">翻譯</button>
          </div>
        </div>
        <div id="txtStatus" class="muted small" hidden></div>
        <div class="result-card" id="txtResult" hidden>
          <div class="result-meta" id="txtResultMeta"></div>
          <div class="result-text" id="txtResultText"></div>
          <div class="result-actions">
            <button id="btnTxtSpeak" class="iconbtn" title="朗讀"><svg class="i"><use href="#i-speaker"/></svg></button>
            <button id="btnTxtCopy" class="iconbtn" title="複製"><svg class="i"><use href="#i-copy"/></svg></button>
            <button id="btnTxtBig" class="iconbtn" title="全螢幕展示給對方看"><svg class="i"><use href="#i-expand"/></svg></button>
            <button id="btnTxtShare" class="iconbtn" title="分享"><svg class="i"><use href="#i-share"/></svg></button>
          </div>
        </div>
        <div class="hist" id="txtHistory"></div>
      </div>
    </section>

    <!-- 照片翻譯 -->
    <section id="tab-photo" class="tab" aria-label="照片翻譯">
      <div class="pad">
        <div class="photo-drop" id="photoDrop">
          <svg class="i big"><use href="#i-image"/></svg>
          <p><strong>上傳照片・立即翻譯</strong></p>
          <p class="muted">點擊選擇、拖曳圖片進來，或直接貼上（Ctrl+V）<br>菜單、藥妝成分表、車站標示、文件截圖都可以</p>
          <div class="photo-langrow">
            <label>原文語言　<select id="photoSource" aria-label="原文語言"></select></label>
          </div>
          <button class="btn primary" id="btnPhotoPick">選擇照片</button>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
        <div class="vision-result" id="photoResult" hidden></div>
      </div>
    </section>

    <!-- 旅遊句庫 -->
    <section id="tab-phrases" class="tab" aria-label="旅遊句庫">
      <div class="pad">
        <input id="phraseSearch" type="search" placeholder="搜尋常用句（例：過敏、退稅、廁所）">
        <div class="chips" id="phraseCats"></div>
        <div class="phrase-list" id="phraseList"></div>
        <p class="muted small center">句庫 100% 離線可用．點任一句可全螢幕展示＆朗讀</p>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="功能切換">
    <button class="tabbtn active" data-tab="talk"><svg class="i"><use href="#i-mic"/></svg><span>對話</span></button>
    <button class="tabbtn" data-tab="camera"><svg class="i"><use href="#i-camera"/></svg><span>相機</span></button>
    <button class="tabbtn" data-tab="text"><svg class="i"><use href="#i-keyboard"/></svg><span>輸入</span></button>
    <button class="tabbtn" data-tab="photo"><svg class="i"><use href="#i-image"/></svg><span>照片</span></button>
    <button class="tabbtn" data-tab="phrases"><svg class="i"><use href="#i-book"/></svg><span>句庫</span></button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="big-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
